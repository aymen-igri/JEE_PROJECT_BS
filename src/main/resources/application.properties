spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/projectjee1
spring.datasource.username=postgres
spring.datasource.password=wacvsrac
spring.datasource.driver-class-name=org.postgresql.Driver

# Fix for "cached plan must not change result type" error with Neon pooler
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Explicit dialect for PostgreSQL (helps when DB is temporarily unreachable)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=8081
# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.file-size-threshold=2MB

spring.flyway.enabled=false

# Email configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:username}
spring.mail.password=${MAIL_PASSWORD:password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Consultation Management Configuration
# Grace period in minutes for diagnostic modifications
app.diagnostic.grace-period-minutes=30

# Billing/Receipt Configuration
app.receipts.path=uploads/receipts

