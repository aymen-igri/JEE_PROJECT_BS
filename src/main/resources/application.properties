spring.application.name=backend
spring.datasource.url=jdbc:postgresql://ep-proud-breeze-ah4ulutn-pooler.c-3.us-east-1.aws.neon.tech/neondb?sslmode=require&prepareThreshold=0
spring.datasource.username=neondb_owner
spring.datasource.password=npg_a2dGfuIYR3VF
spring.datasource.driver-class-name=org.postgresql.Driver

# Fix for "cached plan must not change result type" error with Neon pooler
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Explicit dialect for PostgreSQL (helps when DB is temporarily unreachable)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.file-size-threshold=2MB

spring.flyway.enabled=false

# Email configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=your_username
spring.mail.password=your_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Consultation Management Configuration
# Grace period in minutes for diagnostic modifications
app.diagnostic.grace-period-minutes=30

# Billing/Receipt Configuration
app.receipts.path=uploads/receipts

